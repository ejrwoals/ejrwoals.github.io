<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chajjaem's Homepage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f5f2ee;
            background: #14121a;
            overflow-x: hidden;
        }

        #stage {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(120% 120% at 50% 12%, #2b2440 0%, #191524 46%, #0d0b12 100%);
        }
        #stage canvas { display: block; }

        main {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 6vw;
        }

        .eyebrow {
            font-size: clamp(0.7rem, 1.4vw, 0.85rem);
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: #e0a07d;
            margin-bottom: 1.1rem;
            opacity: 0.9;
        }

        h1 {
            font-size: clamp(2.4rem, 7vw, 5.2rem);
            font-weight: 800;
            line-height: 1.02;
            letter-spacing: -0.02em;
            text-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: clamp(1.5rem, 4.5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        p.lead {
            margin-top: 1.2rem;
            max-width: 30ch;
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            line-height: 1.6;
            color: #b8b2c4;
        }

        .hero { justify-content: flex-start; padding-top: 8vh; }
        .hero .spacer { flex: 1; }

        .scroll-hint {
            position: fixed;
            left: 50%;
            bottom: 26px;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 0.72rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #cfc9db;
            opacity: 0.75;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .scroll-hint::after {
            content: "";
            display: block;
            width: 1px;
            height: 34px;
            margin: 10px auto 0;
            background: linear-gradient(to bottom, #e0a07d, transparent);
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scaleY(0.6); }
            50%      { opacity: 1;   transform: scaleY(1); }
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #14121a;
            color: #e0a07d;
            letter-spacing: 0.3em;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: opacity 0.8s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
    </script>
</head>

<body>
    <div id="loader">loading…</div>
    <div id="stage"></div>

    <main>
        <section class="hero">
            <div class="spacer"></div>
            <div class="eyebrow">welcome</div>
            <h1>chajjaem's&nbsp;Homepage</h1>
            <p class="lead">스크롤을 내려 알약을 돌려보세요.</p>
        </section>
        <section>
            <div class="eyebrow">crafted in code</div>
            <h2>에셋 없이, 순수하게 코드로.</h2>
            <p class="lead">질감도 · 분할선도 · 음각 글씨도 실시간으로 조명에 반응합니다.</p>
        </section>
        <section>
            <div class="eyebrow">keep scrolling</div>
            <h2>돌 때마다, 새로운 인사.</h2>
            <p class="lead">앞면이 다시 돌아올 때마다 글씨가 바뀝니다.</p>
        </section>
        <section>
            <h2>by chajjaem</h2>
        </section>
    </main>

    <div class="scroll-hint" id="scrollHint">scroll</div>

    <script type="module">
        import * as THREE from 'three';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        /* ------------------------------------------------------------------ *
         *  Config
         * ------------------------------------------------------------------ */
        const PILL_COLOR = new THREE.Color('#e88a63');  // salmon/orange body
        const R          = 1.3;      // outer radius
        const THICKNESS  = 0.32;     // pill thickness
        const BEVEL      = THICKNESS / 2;         // semicircular edge radius
        const RFACE      = R - BEVEL;             // flat-face radius
        const SPINS      = 3;        // full rotations across the whole page
        const TEX        = 1024;     // texture resolution
        const NORMAL_STRENGTH = 2.4; // how hard grooves/grain bend the surface normal
        const FLOOR_Y    = -1.3;     // contact line the coin stands on / topples over
        const STAND_H    = R;        // coin centre height above that contact edge

        const PHRASES = [
            "Ideas",
            "Into",
            "Reality"
        ];

        /* ------------------------------------------------------------------ *
         *  Canvas helpers
         * ------------------------------------------------------------------ */
        function newCanvas() {
            const c = document.createElement('canvas');
            c.width = c.height = TEX;
            return c;
        }

        // Fit a font size so the widest line stays within maxW.
        function fitFont(ctx, lines, maxW, startPx) {
            let px = startPx;
            for (;;) {
                ctx.font = `800 ${px}px Helvetica, Arial, sans-serif`;
                const wide = Math.max(...lines.map(l => ctx.measureText(l).width));
                if (wide <= maxW || px <= 60) return px;
                px -= 6;
            }
        }

        // Lay the text out on a context and return a draw(ctx) for it.
        function layoutText(ctx, lines) {
            const px = fitFont(ctx, lines, TEX * 0.80, 280);
            ctx.font = `800 ${px}px Helvetica, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lh = px * 1.12, total = lh * (lines.length - 1);
            return (c) => lines.forEach((l, i) =>
                c.fillText(l, TEX / 2, TEX / 2 - total / 2 + i * lh));
        }

        function shapeText(text) {
            const lines = text.split('\n');
            return (ctx, mode) => {
                if (mode === 'height') {
                    // Graded groove: a blurred glyph mask makes each stroke deeper
                    // at its centre and shallower toward its walls (U cross-section).
                    const mask = newCanvas(), mx = mask.getContext('2d');
                    mx.fillStyle = '#fff';
                    layoutText(mx, lines)(mx);         // solid white glyphs
                    const blur = newCanvas(), bx = blur.getContext('2d');
                    bx.filter = 'blur(7px)';           // soft walls; centres stay solid
                    bx.drawImage(mask, 0, 0);
                    bx.filter = 'none';
                    bx.globalCompositeOperation = 'source-in';
                    bx.fillStyle = '#000';             // recolor to black, keep alpha
                    bx.fillRect(0, 0, TEX, TEX);
                    ctx.save();
                    ctx.filter = 'none';
                    ctx.drawImage(blur, 0, 0);         // dark = deep, centre-weighted
                    ctx.restore();
                } else {
                    layoutText(ctx, lines)(ctx);       // colour AO: uniform fill
                }
            };
        }

        // Stamp a shape into the height field as a centre-deep (U-section) groove.
        function stampGradedGroove(ctx, drawWhite) {
            const mask = newCanvas(), mx = mask.getContext('2d');
            drawWhite(mx);                       // white shapes on transparent
            const blur = newCanvas(), bx = blur.getContext('2d');
            bx.filter = 'blur(6px)';             // soft walls; centres stay solid
            bx.drawImage(mask, 0, 0);
            bx.filter = 'none';
            bx.globalCompositeOperation = 'source-in';
            bx.fillStyle = '#000';               // recolor to black, keep alpha
            bx.fillRect(0, 0, TEX, TEX);
            ctx.save();
            ctx.filter = 'none';
            ctx.drawImage(blur, 0, 0);           // dark = deep, centre-weighted
            ctx.restore();
        }

        function shapeScore() {
            // A rounded vertical bar whose width is a fraction of the full groove.
            const bar = (ctx, wFrac) => {
                const w = TEX * 0.036 * wFrac, x = TEX / 2 - w / 2;
                const y = 0, h = TEX, r = w / 2;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + r, r);
                ctx.lineTo(x + w, y + h - r);
                ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
                ctx.lineTo(x + r, y + h);
                ctx.arcTo(x, y + h, x, y + h - r, r);
                ctx.lineTo(x, y + r);
                ctx.arcTo(x, y, x + r, y, r);
                ctx.closePath();
                ctx.fill();
            };
            // "J" and "M" imprint either side of the line. Drawn mirrored so they
            // read correctly on the back disc (which is flipped 180° about Y).
            const letters = (ctx, fill) => {
                // The pill's own 180° spin cancels the back disc's 180°, so the
                // texture is NOT mirrored when the back faces the camera — draw normally.
                ctx.save();
                ctx.fillStyle = fill;
                ctx.font = `800 ${TEX * 0.24}px Helvetica, Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('J', TEX * 0.30, TEX * 0.5);
                ctx.fillText('M', TEX * 0.70, TEX * 0.5);
                ctx.restore();
            };
            return (ctx, mode) => {
                if (mode === 'height') {
                    // Carve real depth: darkest (deepest) toward the centre, both
                    // along the length and across the width (a V/U cross-section).
                    const grad = (a, b) => {
                        const g = ctx.createLinearGradient(0, 0, 0, TEX);
                        g.addColorStop(0.0, a); g.addColorStop(0.5, b); g.addColorStop(1.0, a);
                        return g;
                    };
                    ctx.fillStyle = grad('#5e5e5e', '#141414'); bar(ctx, 1.0);  // outer, shallow lip
                    ctx.fillStyle = grad('#343434', '#050505'); bar(ctx, 0.6);  // mid
                    ctx.fillStyle = grad('#1a1a1a', '#000000'); bar(ctx, 0.28); // deepest core
                    stampGradedGroove(ctx, (c) => letters(c, '#fff'));          // J | M
                } else {
                    bar(ctx, 1.0);              // colour AO uses the caller's fill
                    letters(ctx, ctx.fillStyle);
                }
            };
        }

        /* ------------------------------------------------------------------ *
         *  Texture generation
         *  color  : flat orange + fine grain + a little occlusion in grooves
         *  height : grayscale relief (surface = mid, grooves = low, + grain)
         *  normal : derived from height so LIGHTING reacts as the pill turns
         * ------------------------------------------------------------------ */

        // Shared speckle field so colour & height agree on where grain sits.
        function speckle(n) {
            const pts = [];
            for (let i = 0; i < n; i++) {
                pts.push([Math.random() * TEX, Math.random() * TEX,
                          Math.random() * 2 + 0.5, Math.random() < 0.5 ? -1 : 1]);
            }
            return pts;
        }

        function paintColor(shapeFn, grain) {
            const c = newCanvas(), ctx = c.getContext('2d');
            ctx.fillStyle = `#${PILL_COLOR.getHexString()}`;
            ctx.fillRect(0, 0, TEX, TEX);
            for (const [x, y, s, d] of grain) {
                ctx.fillStyle = d < 0 ? 'rgba(120,52,30,0.05)' : 'rgba(255,222,196,0.05)';
                ctx.fillRect(x, y, s, s);
            }
            // physically-plausible ambient occlusion: grooves sit a touch darker
            ctx.save();
            ctx.filter = 'blur(2px)';
            ctx.fillStyle = 'rgba(120,50,28,0.35)';
            shapeFn(ctx, 'color');
            ctx.restore();
            return c;
        }

        function paintHeight(shapeFn, grain) {
            const c = newCanvas(), ctx = c.getContext('2d');
            ctx.fillStyle = '#8c8c8c';                 // base surface level
            ctx.fillRect(0, 0, TEX, TEX);
            // micro-relief: the matte tablet tooth that catches raking light
            for (const [x, y, s, d] of grain) {
                const v = 140 + d * 55;
                ctx.fillStyle = `rgb(${v},${v},${v})`;
                ctx.fillRect(x, y, s, s);
            }
            // grooves: dark = recessed. Blur gives sloped walls -> real normals.
            ctx.save();
            ctx.filter = 'blur(2.5px)';
            ctx.fillStyle = '#141414';
            shapeFn(ctx, 'height');
            ctx.restore();
            return c;
        }

        // Sobel over the height map -> tangent-space normal map.
        function toNormalTexture(heightCanvas) {
            const w = heightCanvas.width, h = heightCanvas.height;
            const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
            const out = new ImageData(w, h);
            const o = out.data;
            const at = (x, y) => {
                x = x < 0 ? 0 : x >= w ? w - 1 : x;
                y = y < 0 ? 0 : y >= h ? h - 1 : y;
                return src[(y * w + x) * 4] / 255;
            };
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const dx = (at(x - 1, y) - at(x + 1, y)) * NORMAL_STRENGTH;
                    const dy = (at(x, y - 1) - at(x, y + 1)) * NORMAL_STRENGTH;
                    const len = Math.hypot(dx, dy, 1);
                    const i = (y * w + x) * 4;
                    o[i]     = (dx / len * 0.5 + 0.5) * 255;
                    o[i + 1] = (dy / len * 0.5 + 0.5) * 255;
                    o[i + 2] = (1  / len * 0.5 + 0.5) * 255;
                    o[i + 3] = 255;
                }
            }
            const nc = newCanvas();
            nc.getContext('2d').putImageData(out, 0, 0);
            const t = new THREE.CanvasTexture(nc);
            t.colorSpace = THREE.NoColorSpace;
            return t;
        }

        function buildFace(shapeFn) {
            const grain = speckle(14000);
            const map = new THREE.CanvasTexture(paintColor(shapeFn, grain));
            map.colorSpace = THREE.SRGBColorSpace;
            const normal = toNormalTexture(paintHeight(shapeFn, grain));
            return { map, normal };
        }

        // Tiling grain (no grooves) for the rounded edge, so the rim shares the
        // same matte tooth as the faces instead of being a flat solid colour.
        function buildGrain() {
            const grain = speckle(11000);   // sparser than the faces so the edge isn't "furry"
            const cc = newCanvas(), cx = cc.getContext('2d');
            cx.fillStyle = `#${PILL_COLOR.getHexString()}`;
            cx.fillRect(0, 0, TEX, TEX);
            const hc = newCanvas(), hx = hc.getContext('2d');
            hx.fillStyle = '#8c8c8c';
            hx.fillRect(0, 0, TEX, TEX);
            for (const [x, y, s, d] of grain) {
                cx.fillStyle = d < 0 ? 'rgba(120,52,30,0.10)' : 'rgba(255,222,196,0.10)';
                cx.fillRect(x, y, s, s);
                const v = 140 + d * 80;
                hx.fillStyle = `rgb(${v},${v},${v})`;
                hx.fillRect(x, y, s, s);
            }
            const map = new THREE.CanvasTexture(cc);
            map.colorSpace = THREE.SRGBColorSpace;
            const normal = toNormalTexture(hc);
            [map, normal].forEach(t => {
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(3, 0.3);   // density-matched to the faces so grain dots stay the same visible size
            });
            return { map, normal };
        }

        /* ------------------------------------------------------------------ *
         *  Renderer / scene
         * ------------------------------------------------------------------ */
        const stage = document.getElementById('stage');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.92;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        stage.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 5);

        // Image-based lighting: soft studio env so the matte surface + grooves
        // pick up gradients that shift as the pill rotates.
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        // A warm key light gives a defined highlight that travels on rotation.
        const key = new THREE.DirectionalLight(0xfff0e6, 2.1);
        key.position.set(-2.4, 3, 2.5);
        scene.add(key);
        const rim = new THREE.DirectionalLight(0x9fb4ff, 0.8);
        rim.position.set(2.6, -1.2, -2);
        scene.add(rim);

        const maxAniso = renderer.capabilities.getMaxAnisotropy();

        // Pre-build every face up front so phrase swaps are instant (no hitch).
        const frontFaces = PHRASES.map(p => buildFace(shapeText(p)));
        const backFaceTex = buildFace(shapeScore());
        [...frontFaces, backFaceTex].forEach(f => {
            f.map.anisotropy = maxAniso;
            f.normal.anisotropy = maxAniso;
        });

        const NS = new THREE.Vector2(1.3, 1.3);
        const frontMat = new THREE.MeshStandardMaterial({
            map: frontFaces[0].map, normalMap: frontFaces[0].normal, normalScale: NS,
            roughness: 0.92, metalness: 0.0, envMapIntensity: 0.5
        });
        const backMat = new THREE.MeshStandardMaterial({
            map: backFaceTex.map, normalMap: backFaceTex.normal, normalScale: NS,
            roughness: 0.92, metalness: 0.0, envMapIntensity: 0.5
        });
        const rimGrain = buildGrain();
        rimGrain.map.anisotropy = maxAniso;
        rimGrain.normal.anisotropy = maxAniso;
        const rimMat = new THREE.MeshStandardMaterial({
            map: rimGrain.map, normalMap: rimGrain.normal,
            normalScale: new THREE.Vector2(1.05, 1.05),
            roughness: 0.94, metalness: 0.0, envMapIntensity: 0.45,
            side: THREE.DoubleSide   // keep the edge opaque from every angle
        });

        /* ------------------------------------------------------------------ *
         *  Geometry: flat caps + rounded (semicircular) rim
         * ------------------------------------------------------------------ */
        const pill = new THREE.Group();

        // Rounded edge as a lathe: revolve a half-circle profile.
        const profile = [];
        const SEG = 24;
        for (let i = 0; i <= SEG; i++) {
            const a = Math.PI / 2 - Math.PI * (i / SEG);
            profile.push(new THREE.Vector2(RFACE + BEVEL * Math.cos(a), BEVEL * Math.sin(a)));
        }
        const rimMesh = new THREE.Mesh(new THREE.LatheGeometry(profile, 128), rimMat);
        rimMesh.rotation.x = Math.PI / 2;   // lathe axis Y -> Z, caps face camera
        pill.add(rimMesh);

        const frontDisc = new THREE.Mesh(new THREE.CircleGeometry(RFACE, 128), frontMat);
        frontDisc.position.z = THICKNESS / 2;
        pill.add(frontDisc);

        const backDisc = new THREE.Mesh(new THREE.CircleGeometry(RFACE, 128), backMat);
        backDisc.position.z = -THICKNESS / 2;
        backDisc.rotation.y = Math.PI;
        pill.add(backDisc);

        // Nested rig for a spinning-coin (Euler's-disk) settle: the pill leans
        // over (tilt group) while the whole thing precesses about the vertical
        // axis (precess group), so it spirals down and flattens onto the floor.
        const tilt = new THREE.Group();
        tilt.add(pill);
        const precess = new THREE.Group();
        precess.add(tilt);
        scene.add(precess);

        /* ------------------------------------------------------------------ *
         *  Contact shadow (grounds the pill once it lies down)
         * ------------------------------------------------------------------ */
        const SETTLE_START = 0.62;   // last stretch of the page = "fall over & lie flat"

        function shadowTexture() {
            const c = newCanvas(), ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(TEX / 2, TEX / 2, 0, TEX / 2, TEX / 2, TEX / 2);
            g.addColorStop(0.0, 'rgba(0,0,0,0.55)');
            g.addColorStop(0.55, 'rgba(0,0,0,0.26)');
            g.addColorStop(1.0, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, TEX, TEX);
            const t = new THREE.CanvasTexture(c);
            t.colorSpace = THREE.SRGBColorSpace;
            return t;
        }
        const shadow = new THREE.Mesh(
            new THREE.PlaneGeometry(3.6, 3.6),
            new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent: true,
                                          depthWrite: false, opacity: 0 })
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = FLOOR_Y - BEVEL - 0.01;
        scene.add(shadow);

        /* ------------------------------------------------------------------ *
         *  Scroll-driven animation (spin, then topple flat like a coin)
         * ------------------------------------------------------------------ */
        const TWO_PI = Math.PI * 2;
        let targetP = 0, curP = 0, lastFrontIdx = 0;

        const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
        const smooth = s => s * s * (3 - 2 * s);
        const easeOutCubic = s => 1 - Math.pow(1 - s, 3);
        const easeOutBack = s => {
            const c1 = 1.70158, c3 = c1 + 1;
            return 1 + c3 * Math.pow(s - 1, 3) + c1 * Math.pow(s - 1, 2);
        };
        function easeOutBounce(s) {
            const n1 = 7.5625, d1 = 2.75;
            if (s < 1 / d1) return n1 * s * s;
            if (s < 2 / d1) return n1 * (s -= 1.5 / d1) * s + 0.75;
            if (s < 2.5 / d1) return n1 * (s -= 2.25 / d1) * s + 0.9375;
            return n1 * (s -= 2.625 / d1) * s + 0.984375;
        }

        function scrollProgress() {
            const max = document.body.scrollHeight - window.innerHeight;
            return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        }

        // 2 full turns before the settle, then finish one more turn early in the
        // settle so the coin is standing still (front-up) before it topples over.
        function spinY(p) {
            const pre = Math.min(p, SETTLE_START) / SETTLE_START;
            const s = clamp01((p - SETTLE_START) / (1 - SETTLE_START));
            return TWO_PI * (2 * pre + easeOutCubic(clamp01(s / 0.3)));
        }

        function setFront(idx) {
            frontMat.map = frontFaces[idx].map;
            frontMat.normalMap = frontFaces[idx].normal;
            frontMat.needsUpdate = true;
            lastFrontIdx = idx;
        }

        function onScroll() {
            const p = scrollProgress();
            targetP = p;
            if (p < SETTLE_START) {
                // cycle phrases while the pill is edge-on (text hidden)
                const half = Math.round(spinY(p) / Math.PI);
                const facingFront = (((half % 2) + 2) % 2) === 0;
                if (facingFront) {
                    const idx = ((Math.floor(half / 2) % PHRASES.length) + PHRASES.length) % PHRASES.length;
                    if (idx !== lastFrontIdx) setFront(idx);
                }
            } else if (lastFrontIdx !== PHRASES.length - 1) {
                setFront(PHRASES.length - 1);   // lock the closing message for the landing
            }
            document.getElementById('scrollHint').style.opacity = p > 0.02 ? '0' : '0.75';
        }
        window.addEventListener('scroll', onScroll, { passive: true });

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onResize);

        /* ------------------------------------------------------------------ *
         *  Render loop
         * ------------------------------------------------------------------ */
        const clock = new THREE.Clock();
        function tick() {
            const t = clock.getElapsedTime();
            curP += (targetP - curP) * 0.08;
            const p = curP;
            const s = clamp01((p - SETTLE_START) / (1 - SETTLE_START));

            // Finish the flip so the face points forward, then hold it.
            pill.rotation.y = spinY(p);

            // ---- spinning-coin settle: lean + precession spiral ----
            const topS = clamp01((s - 0.15) / 0.85);
            let lean;
            if (topS < 0.9) {
                const u = topS / 0.9;
                lean = u * u * (Math.PI / 2);                   // gravity ease-in tilt 0 -> 90
            } else {
                const b = (topS - 0.9) / 0.1;
                lean = Math.PI / 2 + Math.sin(b * Math.PI * 2) * 0.04 * (1 - b);  // slap-settle
            }
            tilt.rotation.x = -lean;
            precess.rotation.y = TWO_PI * 3 * smooth(topS);     // ~3 whirls: accelerate, then settle
            precess.position.y = FLOOR_Y + R * Math.cos(lean);  // centre lowers as it flattens

            const ec = smooth(topS);
            const idle = 1 - topS;
            pill.rotation.x = Math.sin(t * 0.6) * 0.05 * idle;  // gentle upright bob (pre-settle)
            pill.position.y = Math.sin(t * 0.9) * 0.03 * idle;
            pill.scale.setScalar(1 + (0.16 * Math.sin(p * Math.PI * 3) + p * 0.1) * (1 - smooth(s)));

            shadow.material.opacity = 0.6 * ec;
            shadow.scale.setScalar(0.5 + 0.7 * ec);

            // camera cranes up and looks down at the spiralling coin
            camera.position.x = 0;
            camera.position.y = Math.sin(p * Math.PI * 2) * 0.22 * (1 - ec) + ec * 2.2;
            camera.position.z = 5 - ec * 0.9;
            camera.lookAt(0, ec * precess.position.y, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(tick);
        }

        onScroll();
        tick();
        requestAnimationFrame(() => {
            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 250);
        });
    </script>
</body>

</html>
